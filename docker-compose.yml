services:
  # Firebase Local Emulator Suite — Firestore and Auth, the two firebase.json
  # declares. Storage is not used by the product, and asking
  # for its emulator failed startup because firebase.json configures none.
  firebase-emulator:
    # Pinned by digest; `latest` changed under us without a diff.
    image: andreysenov/firebase-tools@sha256:120d06169466fca49003a08eb96dca19d95b23d1653a992b1879537aa7086577
    container_name: fit-ready-iq-firebase
    ports:
      - "4000:4000" # Emulator UI
      - "8080:8080" # Firestore
      - "9099:9099" # Auth
    volumes:
      - ./firebase.json:/home/node/firebase/firebase.json:ro
      - ./firestore.rules:/home/node/firebase/firestore.rules:ro
      - ./firestore.indexes.json:/home/node/firebase/firestore.indexes.json:ro
      - firebase_emulator_data:/home/node/firebase/.firebase-emulator
    working_dir: /home/node/firebase
    command: >
      firebase emulators:start
      --only firestore,auth
      --project ${FIREBASE_PROJECT_ID:-fit-ready-iq-dev}
      --import=.firebase-emulator/data
      --export-on-exit=.firebase-emulator/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # FastAPI Backend. Only settings src/config/settings.py actually declares:
  # the Strava, Mapbox and OpenWeather variables this used to pass were removed
  # from the backend, which ignores unknown names.
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: fit-ready-iq-api
    environment:
      - ENVIRONMENT=development
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-fit-ready-iq-dev}
      - FIREBASE_USE_EMULATOR=true
      - FIREBASE_EMULATOR_HOST=firebase-emulator
      # A JSON array: pydantic-settings decodes list fields as JSON before any
      # validator runs, so the comma-separated form crashed startup.
      - 'CORS_ORIGINS=["http://localhost:4790"]'
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend/src:/app/src
    depends_on:
      firebase-emulator:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js frontend on the same port as `npm run dev`. It talks to the real
  # Firebase project in .env.local — the browser SDK is not wired to the
  # emulator, so the flag this used to set did nothing.
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    container_name: fit-ready-iq-web
    env_file:
      - .env.local
    ports:
      - "4790:4790"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  firebase_emulator_data:
