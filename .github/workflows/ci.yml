name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Read-only by default. Without this the token gets the repository's default
# grant, which on older repositories is read-write to everything — for jobs
# that run PR code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    env:
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_API_KEY: dummy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-project
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      # Layering, circular imports and the server-only credential boundary.
      # Rules live in src/frontend/.dependency-cruiser.cjs.
      - name: Architecture rules
        run: npm run lint:deps

      - name: Duplication
        run: npm run lint:dup

      # Unused files, exports and dependencies (knip.jsonc).
      - name: Dead code
        run: npm run lint:dead

      # Broken relative links, empty Markdown, docs/ outside the taxonomy.
      - name: Docs
        run: npm run lint:docs

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: dummy
          FIREBASE_PROJECT_ID: dummy-project
          FIREBASE_CLIENT_EMAIL: dummy@dummy-project.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: "-----BEGIN RSA PRIVATE KEY-----\ndummy\n-----END RSA PRIVATE KEY-----"
          STRAVA_CLIENT_ID: "0"
          STRAVA_CLIENT_SECRET: dummy
          GOOGLE_WEATHER_API_KEY: dummy

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: src/frontend/coverage/
          retention-days: 7

  # Security rules are the one layer the Admin SDK routes never pass through,
  # so no other test can catch a mistake in them. Runs firestore.rules against
  # the emulator (which needs Java). Add "Firestore Rules" to the required
  # checks on main and develop once it has a green run.
  firestore-rules:
    name: Firestore Rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Rules tests
        run: npm run test:rules

  backend:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: abatilo/actions-poetry@0dd19c9498c3dc8728967849d0d2eae428a8a3d8 # v4

      - run: poetry install

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy src/

      # Clean Architecture contracts in pyproject.toml [tool.importlinter].
      - name: Architecture rules
        run: poetry run lint-imports

      - name: Dead code
        run: poetry run vulture

      - name: Tests
        run: poetry run pytest --cov=src --cov-report=xml -q
        env:
          FIREBASE_PROJECT_ID: dummy-project
          TESTING: "true"

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-coverage
          path: src/backend/coverage.xml
          retention-days: 7
