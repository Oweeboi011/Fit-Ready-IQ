name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # Monday 6 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Frontend npm audit
        run: npm audit --audit-level=high
        working-directory: src/frontend

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: abatilo/actions-poetry@v3

      - run: poetry install
        working-directory: src/backend

      - name: Backend pip audit
        run: poetry run pip-audit --vulnerability-service osv -l
        working-directory: src/backend

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Pattern-level static analysis. Complements CodeQL: CodeQL does dataflow,
  # Semgrep catches the shallower "never write it this way here" patterns
  # (dangerouslySetInnerHTML, eval, hard-coded credentials) fast enough to run
  # on every PR. Registry rulesets need no account or token.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    # Advisory for now. Semgrep has no supported Windows binary, so the ruleset
    # could not be dry-run against this repo before landing and the first PR may
    # surface a backlog of pre-existing findings. Triage that backlog, then drop
    # this line to make Semgrep blocking (and add it to branch protection).
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      - name: Scan
        run: >
          semgrep scan
          --error
          --sarif --output semgrep.sarif
          --config p/typescript
          --config p/react
          --config p/secrets
          --config p/owasp-top-ten
          --exclude node_modules
          --exclude .next
          --exclude coverage
          --exclude reports

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
