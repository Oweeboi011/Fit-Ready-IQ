name: Mutation Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/frontend/src/lib/**"
  workflow_dispatch:

# Read-only by default. Without this the token gets the repository's default
# grant, which on older repositories is read-write to everything — for jobs
# that run PR code.
permissions:
  contents: read

jobs:
  stryker:
    name: Stryker Mutation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - name: Run Stryker
        run: npx stryker run
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_API_KEY: dummy
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: dummy-project
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: src/frontend/reports/mutation/
          retention-days: 14
