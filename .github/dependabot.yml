version: 2
updates:
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # develop, not main: main only takes release merges from develop, and
    # updates landing on main directly bypassed the develop gate entirely.
    target-branch: develop
    # A week's delay before a new release is proposed: most compromised
    # packages are caught and yanked inside that window.
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "vitest*"
          - "@vitest/*"
          - "@playwright/*"
          - "@stryker-mutator/*"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"
    ignore:
      # Firebase major versions require coordinated migration
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) compiler. typescript-eslint and Next
      # declare peer ranges below it, so npm ci refuses to install. Lift this
      # once both support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    cooldown:
      default-days: 7

  # The backend image's base; nothing watched it.
  - package-ecosystem: docker
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    target-branch: develop
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    cooldown:
      default-days: 7
    groups:
      # init, analyze and upload-sarif are one action at one version: CodeQL
      # fails when init and analyze disagree, so a bump to either alone can
      # never pass (#122, #126). Bump them together.
      codeql:
        patterns:
          - "github/codeql-action*"
