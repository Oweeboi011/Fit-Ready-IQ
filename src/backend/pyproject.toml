[tool.poetry]
name = "fit-ready-iq-backend"
version = "0.1.0"
description = "FastAPI backend for Fit-Ready-IQ adventure readiness platform"
authors = ["Fit-Ready-IQ Team"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.135"
uvicorn = {extras = ["standard"], version = ">=0.27,<0.53"}
pydantic = "^2.5.0"
pydantic-settings = "^2.14.2"
firebase-admin = "^7.5.0"
python-multipart = "^0.0.32"
httpx = ">=0.27.0,<0.29.0"
authlib = "^1.3.0"
slowapi = "^0.1.10"
gpxpy = "^1.6.2"
fitparse = "^1.2.0"
geopy = "^2.4.1"
shapely = "^2.0.2"
python-dotenv = "^1.0.0"
structlog = "^24.1.0"
sentry-sdk = {extras = ["fastapi"], version = "^1.39.0"}
gevent = "<26.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.1.0"
pip-audit = "^2.7"
ruff = "^0.6.0"
locust = "^2.29.1"
mypy = "^1.8.0"
pytest-httpx = "^0.36.2"
faker = "^22.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
	"unit: fast, isolated tests",
	"integration: tests with app wiring and middleware",
	"performance: load and performance tests",
]
# The floor is enforced, not merely reported. The frontend has had one since the
# gates landed; the backend did not, and it drifted to 68% — far enough that the
# core fitness-scoring path crashed on every input without a test noticing.
# Raise this as coverage improves; never lower it to make a build pass.
addopts = "--cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_also = [
    # Protocol/ABC method bodies are `...` or `raise NotImplementedError` and
    # exist to be overridden. Counting them as uncovered lines measures how many
    # interfaces the domain declares, not how well the code is tested.
    "^\\s*\\.\\.\\.$",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
